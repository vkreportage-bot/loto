name: Update LOTO data

on:
  workflow_dispatch:
  schedule:
    # Heures UTC. À ajuster après validation de l'heure de publication FDJ.
    - cron: "30 21 * * 1"
    - cron: "30 21 * * 3"
    - cron: "30 21 * * 6"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Update draws
        run: npm run update

      - name: Validate
        run: npm run validate

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/
          git commit -m "chore: update LOTO draws"
          git push
