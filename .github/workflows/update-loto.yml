name: Update LOTO data

on:
  workflow_dispatch:
  schedule:
    # GitHub cron = UTC. 22:30 UTC est volontairement après la publication
    # habituelle des tirages du lundi, mercredi et samedi.
    - cron: "30 22 * * 1"
    - cron: "30 22 * * 3"
    - cron: "30 22 * * 6"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Update official FDJ data
        run: npm run update

      - name: Commit updated data
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): update LOTO draws"
          git push
