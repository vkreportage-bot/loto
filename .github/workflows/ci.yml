name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Security audit
        run: npm run audit:ci

      - name: TypeScript and unit tests
        run: npm run check

      - name: Validate committed dataset
        run: npm run validate

      - name: Build personal analysis app
        run: npm run build:frontend
